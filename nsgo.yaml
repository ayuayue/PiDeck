name: PiDeck
id: dev.nsgo.pideckv2
version: 2.0.0
appearance: light
url_schemes: [pideck-v2]

# Direct updates: the app reads appcast-<target>.xml next to the release
# and verifies its EdDSA signature with the public key below; updates.pub
# holds the same value for humans. The private key (updates.key) stays out
# of the repository; CI gets it as NSGO_UPDATES_KEY.
updates:
  key: EHRrpwXBqCbUcC53NQZXBFa2C1D4EhF9BQ8FxMqieIY=
  feed: https://github.com/ayuayue/PiDeck/releases/download/nsgo-stable/
  automatic: true

icon:
  png: assets/Icon.png
  windows: assets/Icon-windows.png

# macOS and iOS use assets/AppIcon.icon, or assets/AppIcon.icns on macOS; the
# other targets, and Apple ones without those, use assets/Icon.png. An Apple
# TV's icon is a wide layered card and an Apple Watch's is drawn in circles,
# so each takes files of its own; name them here:
#   apple: assets/AppIcon.icon  # an Icon Composer .icon; macOS also takes .icns
#   png: assets/Icon.png        # a square PNG, 1024 pixels wide
#   tvos: assets/AppIconTV.brandassets  # layered brand assets, or a wide PNG
#   watchos: assets/AppIconWatch.icon   # an .icon drawn in circles, or a square PNG
# nsgo dev uses the same names ending in -dev where they exist, or the files
# dev.icon names.

dev:
  # native: this machine's backend; web: the browser; ios: a connected iPhone; ios_simulator; android: a connected device or emulator.
  target: native
  # true, the default, rebuilds and restarts on save; false runs once and exits with the app.
  hot_reload: true

apple:
  info:
    NSLocalNetworkUsageDescription: "连接同一局域网内电脑上的 PiDeck。"
    NSCameraUsageDescription: "扫描你对准的二维码以连接电脑上的 PiDeck。"

i18n:
  dir: locales
  source: zh-Hans

android:
  permissions: [CAMERA]

# Two modules keep an extra license file beside a recognized BSD-3-Clause
# LICENSE, and NSGo's classifier knows neither, which stops a build: the SQLite
# public-domain dedication, and the memory module's logo (a Wikimedia Commons
# link, not code). Both texts ship in THIRD_PARTY_NOTICES.txt as they always
# would; the allowance only records that these two were read and accepted, so
# the gate stays strict for everything else.
licenses:
  allow:
    - modernc.org/memory
    - modernc.org/sqlite

build:
  output: dist
  # true opens the output directory after building.
  open: false
  # 不带 -target 的 `go tool nsgo build` 只编这一台的目标：日常构建是 Windows 桌面
  # 宿主的事，多编一个平台就要多一轮跨平台编译（darwin/arm64 约 1 分钟、linux_x64
  # 约 1.7 分钟），而 macOS 与 iOS 在这台机器上本来也打不完包。
  # 六个发布目标各自由 CI 作业用 -target 指定（.github/workflows/），不依赖这里；
  # 本机要一次编六个：go run ./scripts build all。
  targets: [windows_x64]
