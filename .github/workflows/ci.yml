name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Test, type-check and build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        # 临时调试：逐文件串行 + 每文件 60s 超时，定位 Windows runner 上偶发挂起的文件；
        # 定位后恢复为 npm test -- --test-timeout=120000 --test-force-exit
        shell: bash
        timeout-minutes: 10
        run: |
          total=0
          for f in tests/*.test.mjs; do
            total=$((total+1))
            echo "=== [$total] RUN $f"
            if timeout 60 node --test "$f" >/dev/null 2>&1; then
              echo "PASS $f"
            else
              echo ">>> FAIL_OR_TIMEOUT $f"
            fi
          done
          echo "ALL_DONE total=$total"

      - name: Generate app icon
        run: npm run make-icon

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify packaging config
        run: npm run pack

  pet-linux-smoke:
    name: Pet Linux smoke (xvfb)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install Electron system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0 libnss3 libgbm1 libxss1 \
            libxshmfence1 libgl1 libxtst6
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pet window smoke test
        # CI 容器无法给 chrome-sandbox 设置 SUID 4755（需 root），Electron 直接拒绝启动；
        # 加 --no-sandbox 仅作用于测试脚本，不影响产品沙箱设置（由 electronChromiumSandbox 控制）。
        run: xvfb-run -a npx electron --no-sandbox scripts/pet-smoke.cjs
