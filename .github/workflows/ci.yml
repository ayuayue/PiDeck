name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Test, type-check and build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        # --test-timeout：单测超时保护，最坏 2 分钟暴露挂起测试；
        # --test-force-exit：测试完成后强制退出（某测试在 Windows runner 偶发残留
        # open handle 导致 node 进程不退出、Test 步骤无限挂，本地 72s 全绿不重现，
        # 定位中；force-exit 保证 CI 必完成）。
        run: npm test -- --test-timeout=120000 --test-force-exit

      - name: Generate app icon
        run: npm run make-icon

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify packaging config
        run: npm run pack

  pet-linux-smoke:
    name: Pet Linux smoke (xvfb)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install Electron system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0 libnss3 libgbm1 libxss1 \
            libxshmfence1 libgl1 libxtst6
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pet window smoke test
        # CI 容器无法给 chrome-sandbox 设置 SUID 4755（需 root），Electron 直接拒绝启动；
        # 加 --no-sandbox 仅作用于测试脚本，不影响产品沙箱设置（由 electronChromiumSandbox 控制）。
        run: xvfb-run -a npx electron --no-sandbox scripts/pet-smoke.cjs
