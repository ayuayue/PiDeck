name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        if: runner.os == 'Linux'
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            # The diff, not just the names: a formatting drift is fixed in
            # the file the log points at.
            echo "$out" | while read -r f; do gofmt -d "$f"; done
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Tests that commit run the app's own git, and a runner has no
      # identity configured: the commit fails with "Author identity unknown".
      - name: Git identity
        shell: bash
        run: |
          git config --global user.name "PiDeck CI"
          git config --global user.email "ci@pideck.invalid"

      # -short leaves out the slowest end-to-end runs. Tests that drive a
      # real pi skip when it is not installed on the runner; the remaining
      # unit and headless UI tests run on all three platforms.
      - name: Test
        run: go test -short ./... -count=1 -timeout 20m
        env:
          # The rest drive the app headless; no window or GPU is needed.
          CGO_ENABLED: "0"

  web:
    name: web (browser client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The page is this same code compiled to WebAssembly: a browser has no
      # processes or disk, so it drives a desktop over the phone API. The
      # desktop-side build tags keep the workbench out of app.wasm.
      - name: Build the site and embed it
        run: go run ./scripts web

      - name: Budget the wasm
        shell: bash
        run: |
          size=$(stat -c%s webassets/*.wasm.br)
          echo "app.wasm.br: $size bytes"
          # A page downloads this before it draws anything, so it has to stay
          # small: 12 MB is a few seconds over a phone's connection.
          if [ "$size" -gt 12582912 ]; then
            echo "::error::app.wasm.br is $size bytes, over the 12 MB budget"
            exit 1
          fi

      - name: Serve tests
        run: go test -tags webassets -count=1 -run 'WebAsset|WebClient' .

      # vet reads the tests too, and those drive the workbench; a build is
      # what proves the client's file set is coherent.
      - name: Build the client
        run: GOOS=js GOARCH=wasm go build ./...

      - uses: actions/upload-artifact@v4
        with:
          name: webassets
          path: webassets
          if-no-files-found: error

  android:
    name: android (arm64 apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The APK is written by NSGo itself (no SDK, no NDK for arm64), so this
      # catches an Android build breaking before a tag does. It stays out of
      # the release until a stable signing key is configured.
      - name: Build APK
        run: go tool nsgo build -target android_arm64 -version 0.0.1-ci

      - uses: actions/upload-artifact@v4
        with:
          name: pideck-lite-android-arm64
          path: dist/releases/*.apk
          if-no-files-found: error

  ios:
    name: ios (simulator app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The phone build is the client half of the app; without this job an
      # iOS break shows up first in a release run. The simulator needs no
      # Apple account, and the device package signs only when nsgo.yaml
      # names a profile.
      - name: Build for the simulator
        run: go tool nsgo build -target ios_simulator -version 0.0.1-ci

      - uses: actions/upload-artifact@v4
        with:
          name: pideck-lite-ios-simulator
          path: dist/*ios_simulator*/*.app
          if-no-files-found: error

  workflows:
    name: workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A workflow file GitHub cannot parse fails in zero seconds at the tag,
      # where nobody watches: secrets are not available in `if:`, and a bad
      # expression is only reported by the API. Lint it on every push.
      - name: Lint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml

  cross:
    name: cross (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows_x64
            goos: windows
            goarch: amd64
          - target: windows_arm64
            goos: windows
            goarch: arm64
          - target: macos_arm64
            goos: darwin
            goarch: arm64
          - target: macos_x64
            goos: darwin
            goarch: amd64
          - target: linux_x64
            goos: linux
            goarch: amd64
          - target: linux_arm64
            goos: linux
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Every release target must compile from one machine, so a platform
      # break shows up in CI rather than in a tag's release run.
      - name: Build
        run: go build -o "$RUNNER_TEMP/build/" ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
