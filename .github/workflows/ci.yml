name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Test, type-check and build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Setup Go (native modules)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: |
            native/file-index/go.sum
            native/session-index/go.sum
            native/session-store/go.sum
            native/xue-index/go.sum
            native/remote-sftp/go.sum

      - name: Go unit tests (native modules)
        run: |
          go -C native/file-index test ./...
          go -C native/session-index test ./...
          go -C native/session-store test ./...
          go -C native/xue-index test ./...
          go -C native/remote-sftp test ./...

      - name: Install dependencies
        run: npm ci

      - name: Check generated artifacts drift
        # check:* 守卫（--check 模式只校验不写盘）：改了 announcements-md / 扩展 /
        # 提示词 / 技能 / pi-ai 目录源但忘跑对应 generate/build 时红灯，挡住漂移直入
        # main（AGENTS.md「CI 防漂移」承诺的实际执行点）。
        # 必须放在 Build 之前：npm run build 链会静默再生成清单，mask 已提交漂移；
        # check:xueprompts 已内联在 npm run build 脚本链里，不重复接入。
        run: npm run check:announcements && npm run check:pi-ai-catalog && npm run check:extensions-manifest && npm run check:prompts-manifest && npm run check:skills-manifest

      - name: Check pi-ai catalog version drift
        # 模型目录更新有两条源：仓库分支预生成件（主源）与 npm latest 生成源（回退）。
        # 仓库件跟着 devDependencies 走，npm 跟着上游发布走，长期两条线就会让用户
        # 反复看到「提示可更新，点了又写不进去」（发行分支 1.3.0 / npm 1.4.0）。
        # check:pi-ai-catalog 只比本地 node_modules ↔ 仓库文件，发现不了这一层。
        # 需要联网：registry 不可达时脚本自行放行，不把网络抖动当成数据漂移。
        run: npm run check:pi-ai-catalog-drift -- --allow-unknown

      - name: Check formatting & React hooks
        # biome 格式门禁（chore/formatter-baseline）：与上面的 check:* 同一职责——
        # 防止未格式化的代码直入 main 造成格式漂移。本地等价命令 npm run check:format，
        # 修复用 npm run format（或编辑器装 Biome 插件保存即格式化）。
        # check:hooks：correctness/useHookAtTopLevel（独立配置 biome.hooks.jsonc，因为主
        # biome.json 的 linter 整体关闭）。抓的是早退 / 条件分支里调 hook 导致的 React
        # #310「Rendered more hooks than during the previous render」——格式门禁看不见。
        run: npm run check:format && npm run check:hooks

      - name: Check structural invariants
        # 三条机械不变式（各 ~1s，不联网）：
        # - check:ipc-wiring：ipcChannels 的每个通道必须主进程注册 + preload 转发，
        #   agentEventTags 只能出现在主进程（铁律「新 IPC 三处同步」的机器版）；
        # - check:test-shape：禁止新增「只读源码字符串、零运行时验证」的测试，
        #   防止重构成本继续累加（基线在 scripts/testShapeBaseline.json）；
        # - check:file-size：存量巨文件行数只准降不准升，新文件 >600 行必须配拆分计划
        #   （基线在 scripts/fileSizeBaseline.json，拆分方案见 docs/mega-file-split-plan.md）。
        #   没有这条守卫，前三次拆分（index.ts / App.tsx / AgentManager）都在几周内回涨。
        run: npm run check:ipc-wiring && npm run check:test-shape && npm run check:file-size && npm run check:scroll-containers

      - name: Test
        # 串行执行：并发模式（--test-concurrency=4）下测试文件共享进程全局状态，
        # Windows runner 偶发死锁挂起（二分定位：546 文件串行全过、并发偶发挂）；
        # --test-timeout/--test-force-exit 兜底单测超时与 open handle。
        # 2026-10：串行模式也出现间歇性整文件挂起（sessionScannerSubagents 在 CI 上
        # 单文件 47 分钟无输出，本地同文件 2.3s；10-01 曾 6h 空烧）——绿套件约 20-25 分钟，
        # 45 分钟上限兜底：挂起快速红灯重跑，不再占用 runner 六小时。
        timeout-minutes: 45
        run: npm run test:serial -- --test-timeout=120000 --test-force-exit

      - name: Generate app icon
        run: npm run make-icon

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke e2e (renderer + session wiring)
        # 冒烟集（11 个 case / 本地实测 ~1.2 分钟）——只放「单测抓不到、只有真实 Electron 能发现」
        # 的整链路守卫，每条都对应一次真实事故或一次大拆分：
        # 1) smoke：冷启动到工作台骨架（遮罩消失、三栏在位）。
        # 2) session-bootstrap-tabs：启动 → 首发提升为真实会话，占位 Tab 不许残留。
        # 3) session-prewarm-history：预热历史期间焦点/光标不被外部重渲染打散
        #    （2026-11 修过的受控同步缺陷由它守护）。
        # 4) markdown-image-layout：同段多图 96×96 瓷砖、单图 640×360 上限、pideck-file://、点击预览
        #    （hast %5C 编码 / rehype-sanitize 剥属性 / Windows 8.3 短名）。
        # 5) git-panel：status → diff → stage → commit（GitPanel 已拆成子组件 + 8 个 hook）。
        # 6) settings：设置弹框打开 + 主题切换（ConfigModal 已拆成子组件）。
        # 7) drawer：右抽屉切面板 + 内容宽度稳定（无滚动条抖动）。
        # 8) file-tree-dom-budget：根目录行分批挂载（大目录不许一次性铺满 DOM）。
        # 环境依赖型 spec（dsh-restart、remote*Acceptance）刻意不进：它们要真实 DSH/SSH 环境。
        # Windows runner 自带桌面会话，不需要 xvfb。
        timeout-minutes: 15
        run: |
          npx playwright test \
            e2e/smoke.spec.ts \
            e2e/session-bootstrap-tabs.spec.ts \
            e2e/session-prewarm-history.spec.ts \
            e2e/markdown-image-layout.spec.ts \
            e2e/git-panel.spec.ts \
            e2e/settings.spec.ts \
            e2e/drawer.spec.ts \
            e2e/file-tree-dom-budget.spec.ts

      - name: Verify packaging config
        run: npm run pack

  pet-linux-smoke:
    name: Pet Linux smoke (xvfb)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install Electron system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgtk-3-0 libnss3 libgbm1 libxss1 \
            libxshmfence1 libgl1 libxtst6
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pet window smoke test
        # CI 容器无法给 chrome-sandbox 设置 SUID 4755（需 root），Electron 直接拒绝启动；
        # 加 --no-sandbox 仅作用于测试脚本，不影响产品沙箱设置（由 electronChromiumSandbox 控制）。
        run: xvfb-run -a npx electron --no-sandbox scripts/pet-smoke.cjs

  linux-unit-remote:
    name: Linux unit tests (remote/SSH)
    runs-on: ubuntu-latest
    # 为什么单独一个 Linux 单测 job：主 CI 的单测只在 windows-latest 上跑（build job），
    # 而远端/SSH 域里大量行为只在 POSIX 上才走得到——路径分隔与大小写、权限位、
    # symlink/fifo、以及真实 spawn 的 ssh/helper 进程。这些分支在 Windows 上要么被 skip、
    # 要么走另一条实现，Windows 绿灯证明不了 Linux 正确。这里只补这块缺口，不复刻全量套件。
    #
    # 两段式（硬门禁 + 跟踪）：
    # 1) 硬门禁：24 个文件在 Linux 上实测全绿（338 tests = 333 pass + 5 个平台/root-only skip），
    #    红了就挡合并；
    # 2) 跟踪：remote*/ssh* 全扫，continue-on-error。当前既有红已清零；保留跟踪是为了让
    #    runner 与本地环境差异留下失败清单。任何新红按缺陷处理，不能拿非阻断当免修理由。
    # 超时：硬门禁在本机 Linux 实测约 1 分钟（最慢 remoteProjectDirFacts ~15s），给 15 分钟；
    # 全扫给 25 分钟；job 45 分钟与 Windows job 同量级，兜底整文件挂起（见 build job 注释）。
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Setup Go (native modules)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: |
            native/file-index/go.sum
            native/session-index/go.sum
            native/session-store/go.sum
            native/xue-index/go.sum
            native/remote-sftp/go.sum

      - name: Go unit tests (native modules, Linux)
        run: |
          go -C native/file-index test ./...
          go -C native/session-index test ./...
          go -C native/session-store test ./...
          go -C native/xue-index test ./...
          go -C native/remote-sftp test ./...

      - name: Install dependencies
        run: npm ci

      - name: Hard gate - remote/SSH subset green on Linux
        # 这 24 个文件是「在 Linux 上实测全绿」的集合；逐文件计数与基线对照见
        # docs/ci-linux-known-failures.md §1。
        # --test-concurrency=1 与 npm run test:serial 同口径：测试文件共享进程全局状态，
        # 并发会互相干扰；--test-timeout/--test-force-exit 与 Windows job 同理，兜底单测
        # 超时与 open handle。
        # remoteBootstrapContract 允许 1 个 root-only skip（chown 用例，非 root runner 必然 skip）。
        timeout-minutes: 15
        run: |
          node --test --test-concurrency=1 --test-timeout=120000 --test-force-exit \
            tests/remoteProjectLifecycle.test.mjs \
            tests/remoteProjectDirFacts.test.mjs \
            tests/remoteDirWatchDeep.test.mjs \
            tests/remoteDirWatchDegradedHint.test.mjs \
            tests/remoteDirectoryPageWatchDegraded.test.mjs \
            tests/remoteProjectUpload.test.mjs \
            tests/remoteSftpAdapter.test.mjs \
            tests/remoteRootPooling.test.mjs \
            tests/remoteRootSessionPool.test.mjs \
            tests/remoteProjectRootReverify.test.mjs \
            tests/remoteProjectWatchKeepAlive.test.mjs \
            tests/remoteGitCompare.test.mjs \
            tests/remoteBootstrapContract.test.mjs \
            tests/remoteBootstrapSessionIntegration.test.mjs \
            tests/remoteBrowseRoot.test.mjs \
            tests/piAuthHostLaunch.test.mjs \
            tests/remoteBootstrapUpload.test.mjs \
            tests/remoteBundleMaintenance.test.mjs \
            tests/remoteGitStability.test.mjs \
            tests/remoteHelperSearchNames.test.mjs \
            tests/remoteSearchIsolation.test.mjs \
            tests/sshVerifiedConnection.test.mjs \
            tests/sshCommandBuilder.test.mjs \
            tests/sshClientRuntime.test.mjs

      - name: Track full remote/SSH sweep (non-blocking)
        # continue-on-error 是为了「不让环境差异挡合并」，不是「允许新红」：跑完把失败清单与
        # docs/ci-linux-known-failures.md 对照；当前已知红已清零，任何新红按缺陷处理。
        # glob 用引号包住交给 node 自己展开（与 package.json 的 test 脚本同写法），
        # 不依赖 runner 的 shell 行为。
        continue-on-error: true
        timeout-minutes: 25
        run: node --test --test-concurrency=1 --test-timeout=120000 --test-force-exit "tests/remote*.test.mjs" "tests/ssh*.test.mjs"
