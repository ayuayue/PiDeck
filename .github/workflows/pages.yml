name: Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs-site/**"
      - "docs/images/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs-site/**"
      - "docs/images/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VitePress site
    runs-on: ubuntu-latest
    # 自定义域名 pideck.caoayu.top 挂在站点根路径，不能再按 /PiDeck/ 子路径构建。
    env:
      VITEPRESS_BASE: /
      DOCS_SITE_ORIGIN: https://pideck.caoayu.top
      # 站长平台验证码（GSC/Bing）：在 GitHub Pages 环境或仓库变量里配置后
      # 自动注入 <meta name="google-site-verification">；不配置则不输出该标签。
      GSC_VERIFICATION: ${{ vars.GSC_VERIFICATION || '' }}
      BING_VERIFICATION: ${{ vars.BING_VERIFICATION || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # sitemap lastmod 需要 git 历史（文件最后提交时间），浅克隆重取一次
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build documentation site
        run: npm run docs:build

      - name: Generate sitemap
        run: |
          BASE="${VITEPRESS_BASE:-/}"
          ORIGIN="${DOCS_SITE_ORIGIN:-https://pideck.caoayu.top}"
          SITEMAP="docs-site/.vitepress/dist/sitemap.xml"
          echo '<?xml version="1.0" encoding="UTF-8"?>' > "$SITEMAP"
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> "$SITEMAP"
          # cleanUrls: true → 线上路由是无尾斜杠形式（guide/faq 返回 200，
          # guide/faq/ 返回 404）。sitemap 必须与真实路由一致，否则提交给
          # 搜索引擎的 URL 全量 404，页面永远不被收录。404.html 不进 sitemap。
          find docs-site/.vitepress/dist -type f -name '*.html' | sort | while read -r file; do
            rel="${file#docs-site/.vitepress/dist/}"
            [ "$rel" = "404.html" ] && continue
            rel="${rel%.html}"
            if [ "$rel" = "index" ]; then
              loc="$BASE"
            elif [ "$rel" = "en/index" ]; then
              # 英文首页：en/index.html 对应 /en/ 路由，拼成 en/index 会 404
              loc="${BASE}en/"
            else
              loc="$BASE$rel"
            fi
            # lastmod 取源文件（docs-site 下对应 .md）的最后提交时间；
            # 构建产物 html 本身不在 git 里查不到历史，映射规则：dist/<rel>.html → docs-site/<rel>.md
            src_rel="${file#docs-site/.vitepress/dist/}"
            mtime=""
            for candidate in "docs-site/${src_rel}" "docs-site/${src_rel%.html}.md"; do
              mtime=$(git log -1 --format=%cI -- "$candidate" 2>/dev/null || true)
              [ -n "$mtime" ] && break
            done
            if [ -n "$mtime" ]; then
              echo "  <url><loc>${ORIGIN}${loc}</loc><lastmod>${mtime}</lastmod></url>" >> "$SITEMAP"
            else
              echo "  <url><loc>${ORIGIN}${loc}</loc></url>" >> "$SITEMAP"
            fi
          done
          echo '</urlset>' >> "$SITEMAP"
          cat "$SITEMAP"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
