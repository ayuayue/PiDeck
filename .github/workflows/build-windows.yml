name: Build Windows

# 手动触发：可选构建分支/tag（默认 main）与目标架构（默认 both = x64 + arm64）
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要构建的分支或 tag（如 dev、main、v0.7.0）
        required: false
        default: main
      arch:
        description: 目标架构
        required: false
        default: both
        type: choice
        options:
          - both
          - x64
          - arm64

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch == 'both' && '["x64", "arm64"]' || format('["{0}"]', inputs.arch)) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate app icon
        run: npm run make-icon

      - name: Build Windows ${{ matrix.arch }} package
        run: npm run build && npx electron-builder --win nsis portable zip --${{ matrix.arch }} --publish never
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload Windows ${{ matrix.arch }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest-win.yml
