name: macOS Icon

on:
  push:
    branches: [main, dev]
    paths:
      - .github/workflows/mac-icon.yml
      - scripts/make-icon.js
      - build/icon.icns
      - build/icon.svg
      - build/icon-pi-tui.svg
      - build/icons/**
      - tests/macIcon.test.mjs
      - package.json
      - package-lock.json
  pull_request:
    branches: [main, dev]
    paths:
      - .github/workflows/mac-icon.yml
      - scripts/make-icon.js
      - build/icon.icns
      - build/icon.svg
      - build/icon-pi-tui.svg
      - build/icons/**
      - tests/macIcon.test.mjs
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  mac-icon:
    name: Native icon decoding
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install dependencies without Electron lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify checked-in ICNS with the native decoder
        run: node --test tests/macIcon.test.mjs

      - name: Generate app icon
        run: npm run make-icon

      - name: Verify regenerated ICNS with the native decoder
        run: node --test tests/macIcon.test.mjs
