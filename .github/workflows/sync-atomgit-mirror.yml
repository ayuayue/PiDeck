name: Sync AtomGit Repo

# 将 GitHub 仓库的分支与 Tag 直推到 AtomGit（push 直推方案）。
#
# 背景：曾尝试调用 AtomGit OpenAPI 触发镜像仓拉取同步（PUT sync_repo），
# 但该接口是 Fork 仓同步专用，对拉取镜像仓返回 404 "Project not found:null"，
# 且 AtomGit 没有公开的「触发拉取镜像立即同步」API，故改为 git push 直推。
#
# 触发：每次 push 后即时同步，并保留每小时整点兜底（覆盖 GitHub 定时任务
# 高峰期延迟，以及 AtomGit 侧被手工改动后的强制回正）。
#
# 注意：要求 AtomGit 侧 ayuayue/PiDeck 仓库可写。若之前在 AtomGit 配置过
# 「拉取镜像」，需先在镜像设置中关闭/删除镜像配置，否则 push 会被只读策略拒绝。

on:
  push:
    branches: ['**']
    tags: ['**']
  # 注意：schedule 仅当本文件位于默认分支（main）时生效；且 GitHub 定时任务高峰期可能延迟 5-30 分钟
  schedule:
    - cron: '0 */1 * * *' # 每小时整点兜底
  workflow_dispatch:

permissions:
  contents: read

# push 高频提交时只保留最新一次同步，避免排队堆积
concurrency:
  group: sync-atomgit-repo
  cancel-in-progress: true

jobs:
  push-to-atomgit:
    name: Push branches and tags to AtomGit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch all tags
        run: git fetch --force --tags origin

      - name: Push branches and tags to AtomGit
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          ATOMGIT_REPO: ayuayue/PiDeck
        run: |
          set -euo pipefail
          # AtomGit git-over-https 认证：用户名 + token 作为密码。
          # GitHub Actions 会自动掩码 secrets 值，token 不会明文出现在日志中。
          git remote add atomgit "https://ayuayue:${ATOMGIT_TOKEN}@atomgit.com/${ATOMGIT_REPO}.git"
          # --force：GitHub 是唯一事实源，AtomGit 侧任何本地改动都被覆盖；
          # --prune：GitHub 上已删除的分支/Tag 同步从 AtomGit 删除。
          git push --force --prune atomgit "refs/remotes/origin/*:refs/heads/*"
          git push --force atomgit "refs/tags/*:refs/tags/*"
          echo "✅ 分支与 Tag 已直推到 AtomGit"
