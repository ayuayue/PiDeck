name: NSGo 同步到 AtomGit

# AtomGit 上的 ayuayue/PiDeck-V2 是国内可达的镜像：
# - 应用的公告读取先走它的 contents 接口（GitHub raw 只兜底）；
# - 发版后把 Release 正文与安装包附件同步过去，国内用户也能从 AtomGit 下载。
# 仓库最初由 GitHub 导入，之后由这里推送，避免两边分叉。
on:
  push:
    branches: [nsgo]
  workflow_call:
    inputs:
      tags:
        type: string
        required: true
      force_resync:
        type: boolean
        default: false
    secrets:
      ATOMGIT_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tags:
        description: "要同步的 NSGo Release：auto = nsgo-stable；也可填 nsgo-v2.0.0 或用逗号分隔多个"
        required: false
        type: string
        default: auto
      force_resync:
        description: "强制重传：先删掉 AtomGit 上该 tag 的全部附件再传（同版本号重建产物后重发版时用）"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# 同一时间只跑一次，避免分支推送、发布与手动同步抢占远端的写。
concurrency:
  group: nsgo-sync-atomgit
  cancel-in-progress: false

env:
  # 镜像前确认附件清单稳定，手动同步也不会读到仍在上传的产物，
  # 否则会把只传了一半的安装包镜像过去。
  ASSET_WAIT_DEADLINE_SECONDS: "1200"
  ASSET_POLL_INTERVAL_SECONDS: "60"
  ASSET_STABLE_REQUIRED: "3"

jobs:
  sync:
    name: 同步分支、标签与 Release
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          # 标签与完整历史；浅克隆推不过去，也读不到旧 Release。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # AtomGit 官方的加速方案：runner 跨境直连对象存储很慢，固定解析到
      # 官方代理 IP；只在本次 runner 内生效，不改仓库。
      - name: AtomGit 代理解析加速
        run: |
          echo "159.138.147.37 api.atomgit.com" | sudo tee -a /etc/hosts
          echo "159.138.147.37 file.atomgit.com" | sudo tee -a /etc/hosts
          echo "159.138.147.37 file.gitcode.com" | sudo tee -a /etc/hosts
          getent hosts api.atomgit.com file.atomgit.com file.gitcode.com

      - name: 推送 NSGo 到镜像 main 与独立标签
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ATOMGIT_TOKEN}" ]; then
            echo "::error::缺少 ATOMGIT_TOKEN：在仓库 Secrets 里添加 AtomGit 访问令牌（api、write_repository）。"
            exit 1
          fi
          # 令牌走凭据助手，不拼进 URL：失败信息里不会带出它。
          # shellcheck disable=SC2016  # 这段是 git 的凭据助手，$ATOMGIT_TOKEN 由它在运行时展开
          push() {
            git -c credential.helper='!f() { echo username=ayuayue; echo "password=${ATOMGIT_TOKEN}"; }; f' \
              push https://atomgit.com/ayuayue/PiDeck-V2.git "$@"
          }
          # 保留镜像 main，旧客户端的公告地址继续有效。
          git fetch --no-tags origin nsgo
          push "FETCH_HEAD:refs/heads/main"
          if [ -n "$(git tag --list 'nsgo-v*')" ]; then
            push 'refs/tags/nsgo-v*:refs/tags/nsgo-v*'
          fi
          # 只刷新 NSGo stable 别名，不推送共享仓库的 Electron 标签。
          if git ls-remote --exit-code origin refs/tags/nsgo-stable >/dev/null; then
            git fetch --force origin refs/tags/nsgo-stable:refs/tags/nsgo-stable
            push '+refs/tags/nsgo-stable:refs/tags/nsgo-stable'
          fi

      - name: 解析要同步的 tag
        id: resolve
        if: ${{ github.event_name == 'workflow_dispatch' || inputs.tags != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          tags="$INPUT_TAGS"
          if [ "$tags" = "auto" ] || [ -z "$tags" ]; then tags="nsgo-stable"; fi
          tags=$(echo "$tags" | tr ',' '\n' | sed 's/[[:space:]]//g' | paste -sd, -)
          for tag in $(echo "$tags" | tr ',' ' '); do
            if [[ "$tag" != nsgo-stable && ! "$tag" =~ ^nsgo-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::只允许 NSGo 稳定版本标签或 nsgo-stable：$tag"
              exit 1
            fi
          done
          echo "同步 tag：${tags}"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: 等 Release 附件传完
        if: ${{ github.event_name == 'workflow_dispatch' || inputs.tags != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ steps.resolve.outputs.tags }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + ASSET_WAIT_DEADLINE_SECONDS))
          for tag in $(echo "$TAGS" | tr ',' ' '); do
            stable=0
            last=""
            while [ $SECONDS -lt $deadline ]; do
              sig=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
                --jq '[.assets[] | .name + ":" + (.size | tostring)] | sort | join("|")' 2>/dev/null) || sig=""
              if [ -n "$sig" ] && [ "$sig" = "$last" ]; then
                stable=$((stable + 1))
              else
                stable=0
              fi
              last="$sig"
              echo "  ${tag}：附件清单 ${#sig} 字节，稳定 ${stable}/${ASSET_STABLE_REQUIRED}"
              if [ "$stable" -ge "$ASSET_STABLE_REQUIRED" ]; then break; fi
              sleep "$ASSET_POLL_INTERVAL_SECONDS"
            done
            if [ "$stable" -lt "$ASSET_STABLE_REQUIRED" ]; then
              echo "::warning::${tag} 的附件在 ${ASSET_WAIT_DEADLINE_SECONDS}s 内没稳定；按当前清单继续，缺的可手动重跑补齐。"
            fi
          done

      - name: 同步 Release 与附件
        if: ${{ github.event_name == 'workflow_dispatch' || inputs.tags != '' }}
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAGS: ${{ steps.resolve.outputs.tags }}
          FORCE_RESYNC: ${{ inputs.force_resync }}
        run: |
          set -euo pipefail
          for tag in $(echo "$TAGS" | tr ',' ' '); do
            extra=()
            if [ "${FORCE_RESYNC}" = "true" ] || [ "$tag" = "nsgo-stable" ]; then
              extra+=(--force-resync)
            fi
            node scripts/sync-release-to-atomgit.mjs --tags "$tag" --gh-repo "$GITHUB_REPOSITORY" "${extra[@]}"
          done
