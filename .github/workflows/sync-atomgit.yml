name: Sync Release to AtomGit

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tags:
        description: "要同步到 AtomGit 的 Release Tag，逗号分隔（如 v0.7.2,v0.7.3,v0.7.4；留空则只同步最新 Release）"
        required: false
        default: ""

permissions:
  contents: read

# 防并发：release 事件与手动触发同时跑会互相抢占上传（同名附件幂等跳过依赖串行）
concurrency:
  group: sync-atomgit
  cancel-in-progress: false

jobs:
  sync-atomgit:
    name: Sync Release to AtomGit
    runs-on: ubuntu-latest
    # 兜底超时：历史上 PUT 上传挂起导致 job 卡了 52 分钟无进展；
    # 三个版本全量约 7GB，上传速度不确定，给足 6 小时（GitHub hosted runner 上限）；超时强制失败后可重跑（已传附件自动跳过）
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve target tags
        id: resolve-tags
        run: |
          TAGS="${{ github.event.inputs.tags }}"
          if [ -z "$TAGS" ] && [ "${{ github.event_name }}" = "release" ]; then
            TAGS="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$TAGS" ]; then
            # 留空时只同步 GitHub 仓库最新 Release（与旧行为一致）
            echo "No tags specified, fetching latest release from GitHub..."
            TAGS=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          fi
          if [ -z "$TAGS" ]; then
            echo "::error::未能识别或获取到合法的 Release Tag"
            exit 1
          fi
          # 归一化：去空白、去空段
          TAGS=$(echo "$TAGS" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep -v '^$' | paste -sd, -)
          echo "Target tags: ${TAGS}"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: AtomGit 官方代理解析加速（/etc/hosts）
        # AtomGit 官方提供的加速方案：runner 直连 AtomGit/GitCode 对象存储跨境上传极慢
        # （实测 160MB 需 20-35 分钟），固定解析到官方代理 IP 后走优化线路。
        # 仅 runner 内临时生效，不改仓库。
        run: |
          echo "159.138.147.37 api.atomgit.com" | sudo tee -a /etc/hosts
          echo "159.138.147.37 file.atomgit.com" | sudo tee -a /etc/hosts
          echo "159.138.147.37 file.gitcode.com" | sudo tee -a /etc/hosts
          getent hosts api.atomgit.com file.atomgit.com file.gitcode.com

      - name: Run sync script
        run: |
          node scripts/sync-release-to-atomgit.mjs --tags "${{ steps.resolve-tags.outputs.tags }}" --gh-repo "${{ github.repository }}"
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
