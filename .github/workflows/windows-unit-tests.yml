name: Windows Unit Tests

on:
  workflow_call:
  # dev 改动调用方或本工作流时额外运行，直接验证 Windows 门禁配置。
  push:
    branches: [dev]
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/windows-unit-tests.yml

permissions:
  contents: read

concurrency:
  group: windows-unit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows unit tests (${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        # 0.13.1/0.13.2 的全量串行作业都超过 45 分钟。Node 按文件把同一组
        # glob 分成两片，在独立 runner 上运行。每片保持串行，避免同机并发挂起。
        # Node 只解析文件列表前的选项。npm run test:serial -- 会把参数追加到列表后。
        # Node 24.13.0 / Windows 的 --test-force-exit 会让 fetch 用例在全部通过后
        # 触发 UV_HANDLE_CLOSING 断言；保留单测超时与步骤上限，让进程自然退出。
        timeout-minutes: 45
        run: node --test --test-concurrency=1 --test-shard=${{ matrix.shard }} --test-timeout=120000 "tests/*.test.mjs" "tests/cua/*.test.mjs"
