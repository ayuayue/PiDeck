name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v
        required: false

permissions:
  contents: write

jobs:
  web:
    name: web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # One page serves every platform: it is Go compiled to WebAssembly and
      # talks to a desktop over the phone API. Compressed, it is what the
      # desktop binaries embed.
      - name: Build the site and embed it
        run: go run ./scripts web

      - uses: actions/upload-artifact@v7
        with:
          name: webassets
          path: webassets/site
          if-no-files-found: error

  build:
    name: build (${{ matrix.target }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows_x64
          - os: windows-latest
            target: windows_arm64
          - os: macos-latest
            target: macos_arm64
          - os: macos-latest
            target: macos_x64
          - os: ubuntu-latest
            target: linux_x64
          - os: ubuntu-latest
            target: linux_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          v="$REQUESTED_VERSION"
          if [ -z "$v" ]; then v="${GITHUB_REF_NAME#v}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Select release profile
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 scripts/release_profile.py "$RELEASE_VERSION"

      # -tags webassets embeds webassets/site/ into the binary, so every desktop
      # build also serves the browser client on the remote port.
      - uses: actions/download-artifact@v8
        with:
          name: webassets
          path: webassets/site

      - name: Install NSIS (Windows installer)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: Install GTK 4 (Linux runtime)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-1 libpango-1.0-0 libcairo2

      - name: Build
        shell: bash
        env:
          NSGO_UPDATES_KEY: ${{ secrets.NSGO_UPDATES_KEY }}
          GOFLAGS: -tags=webassets
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_TARGET: ${{ matrix.target }}
          MAC_CERT: ${{ secrets.MACOS_DEVELOPER_ID_P12_B64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MAC_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_IDENTITY }}
          MAC_NOTARY_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MAC_NOTARY_TEAM: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MAC_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          args=(-target "$RELEASE_TARGET" -version "$RELEASE_VERSION")
          if [[ "$RELEASE_TARGET" == macos_* && -n "$MAC_CERT" && -n "$MAC_IDENTITY" ]]; then
            keychain="$RUNNER_TEMP/pideck-macos-signing.keychain-db"
            keychain_password="$(openssl rand -hex 24)"
            cert="$RUNNER_TEMP/pideck-macos-signing.p12"
            trap 'security delete-keychain "$keychain" || true; rm -f "$cert"' EXIT
            printf '%s' "$MAC_CERT" | base64 -D > "$cert"
            security create-keychain -p "$keychain_password" "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security list-keychains -d user -s "$keychain" login.keychain-db
            security import "$cert" -k "$keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
            args+=(-sign "$MAC_IDENTITY")
            if [ -n "$MAC_NOTARY_ID" ] && [ -n "$MAC_NOTARY_TEAM" ] && [ -n "$MAC_NOTARY_PASSWORD" ]; then
              xcrun notarytool store-credentials pideck-v2-release --keychain "$keychain" \
                --apple-id "$MAC_NOTARY_ID" --team-id "$MAC_NOTARY_TEAM" --password "$MAC_NOTARY_PASSWORD"
              args+=(-notarize pideck-v2-release)
            fi
          fi
          go tool nsgo build "${args[@]}"

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          if [ -d dist/releases ]; then cp -r dist/releases/* out/ 2>/dev/null || true; fi
          for target_dir in dist/*-${{ matrix.target }}; do
            if [ -d "$target_dir" ]; then cp -r "$target_dir"/* out/ 2>/dev/null || true; fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: pideck-v2-${{ matrix.target }}
          path: out
          if-no-files-found: warn

  android:
    name: android (arm64 apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          v="$REQUESTED_VERSION"
          if [ -z "$v" ]; then v="${GITHUB_REF_NAME#v}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Select release profile
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: python3 scripts/release_profile.py "$RELEASE_VERSION"

      # NSGo writes the APK itself: arm64 needs no Android SDK and no NDK.
      # Without a keystore it signs with a debug key, which cannot update an
      # installed build, so a release should set ANDROID_KEYSTORE_B64.
      - name: Build APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          NSGO_KEYSTORE_PASSWORD: ${{ secrets.NSGO_KEYSTORE_PASSWORD }}
          NSGO_KEY_PASSWORD: ${{ secrets.NSGO_KEY_PASSWORD }}
        run: |
          args=(-target android_arm64 -version "${{ steps.version.outputs.value }}")
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            args+=(-keystore "$RUNNER_TEMP/release.p12")
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set: this APK is debug-signed and cannot update an installed one"
          fi
          go tool nsgo build "${args[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: pideck-v2-android-arm64
          path: |
            dist/releases/*.apk
            dist/releases/appcast-android_arm64.xml
          if-no-files-found: error

  ios:
    name: ios (simulator app, ipa)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          v="$REQUESTED_VERSION"
          if [ -z "$v" ]; then v="${GITHUB_REF_NAME#v}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Select release profile
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: python3 scripts/release_profile.py "$RELEASE_VERSION"

      # The same code the phone build uses: it is a client of a desktop's
      # server. The simulator app needs nothing from Apple; an IPA that
      # installs on a device needs a profile and a certificate, which come
      # from IOS_PROFILE_B64 and IOS_CERT_P12_B64. Without them NSGo writes
      # an unsigned IPA and says so.
      - name: Build for the simulator
        shell: bash
        run: go tool nsgo build -target ios_simulator -version "${{ steps.version.outputs.value }}"

      - name: Build the device package
        shell: bash
        env:
          PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
          CERT_B64: ${{ secrets.IOS_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          TEAM: ${{ secrets.IOS_TEAM }}
        run: |
          set -euo pipefail
          args=(-target ios -version "${{ steps.version.outputs.value }}")
          if [ -n "$PROFILE_B64" ] && [ -n "$CERT_B64" ]; then
            echo "$CERT_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
            echo "$PROFILE_B64" | base64 -d > "$RUNNER_TEMP/app.mobileprovision"
            keychain="$RUNNER_TEMP/build.keychain-db"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
            security list-keychains -d user -s "$keychain"
            mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
            cp "$RUNNER_TEMP/app.mobileprovision" ~/Library/MobileDevice/"Provisioning Profiles/app.mobileprovision"
            args+=(-profile "$RUNNER_TEMP/app.mobileprovision")
            if [ -n "${TEAM:-}" ]; then args+=(-team "$TEAM"); fi
          else
            echo "::warning::no IOS_PROFILE_B64/IOS_CERT_P12_B64: the IPA is unsigned and installs only after re-signing"
          fi
          go tool nsgo build "${args[@]}"

      # The simulator build stays in its own directory, so it is zipped here.
      - name: Pack the simulator app
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          apps=(./*ios_simulator*/*.app)
          ditto -c -k --sequesterRsrc --keepParent "${apps[0]}" "$RUNNER_TEMP/ios-simulator.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: pideck-v2-ios
          path: |
            dist/releases/*.ipa
            ${{ runner.temp }}/ios-simulator.zip
          if-no-files-found: error

  publish:
    name: publish
    needs: [build, android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The feed is releases/latest/download/appcast-<target>.xml, so a
      # release that leaves one out answers 404 for that target's updates
      # until a later release carries it again.
      - name: Appcasts
        shell: bash
        env:
          NSGO_UPDATES_KEY: ${{ secrets.NSGO_UPDATES_KEY }}
        run: |
          if [ -z "$NSGO_UPDATES_KEY" ]; then
            echo "::warning::NSGO_UPDATES_KEY is not set, so no release carries appcasts and no app can update itself"
            exit 0
          fi
          missing=""
          for target in windows_x64 windows_arm64 macos_arm64 macos_x64 linux_x64 linux_arm64 android_arm64; do
            test -f "artifacts/appcast-$target.xml" || missing="$missing $target"
          done
          if [ -n "$missing" ]; then
            echo "::error::no appcast for:$missing (NSGO_UPDATES_KEY signs them)"
            exit 1
          fi
          ls -1 artifacts/appcast-*.xml

      - name: Checksums
        shell: bash
        run: |
          cd artifacts
          # One line per file so a download can be checked with
          # sha256sum -c SHA256SUMS
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/sums"
          mv "$RUNNER_TEMP/sums" SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        if: '!contains(github.ref_name, ''-dev'')'
        with:
          files: artifacts/**
          generate_release_notes: true

      - uses: softprops/action-gh-release@v3
        if: contains(github.ref_name, '-dev')
        with:
          tag_name: dev
          name: PiDeck V2 Dev
          prerelease: true
          make_latest: false
          files: artifacts/**
