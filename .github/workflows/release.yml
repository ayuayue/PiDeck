name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v
        required: false

permissions:
  contents: write

jobs:
  web:
    name: web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # One page serves every platform: it is Go compiled to WebAssembly and
      # talks to a desktop over the phone API. Compressed, it is what the
      # desktop binaries embed.
      - name: Build the site and embed it
        run: go run ./scripts web

      - uses: actions/upload-artifact@v4
        with:
          name: webassets
          path: webassets
          if-no-files-found: error

  build:
    name: build (${{ matrix.target }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows_x64
          - os: windows-latest
            target: windows_arm64
          - os: macos-latest
            target: macos_arm64
          - os: macos-latest
            target: macos_x64
          - os: ubuntu-latest
            target: linux_x64
          - os: ubuntu-latest
            target: linux_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Version
        id: version
        shell: bash
        run: |
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ]; then v="${GITHUB_REF_NAME#v}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      # -tags webassets embeds webassets/ into the binary, so every desktop
      # build also serves the browser client on the remote port.
      - uses: actions/download-artifact@v4
        with:
          name: webassets
          path: webassets

      - name: Install NSIS (Windows installer)
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: Install GTK 4 (Linux runtime)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-1 libpango-1.0-0 libcairo2

      - name: Build
        shell: bash
        env:
          NSGO_UPDATES_KEY: ${{ secrets.NSGO_UPDATES_KEY }}
          GOFLAGS: -tags=webassets
        run: go tool nsgo build -target ${{ matrix.target }} -version ${{ steps.version.outputs.value }}

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          if [ -d dist/releases ]; then cp -r dist/releases/* out/ 2>/dev/null || true; fi
          if [ -d "dist/PiDeck Lite-${{ steps.version.outputs.value }}-${{ matrix.target }}" ]; then
            cp -r "dist/PiDeck Lite-${{ steps.version.outputs.value }}-${{ matrix.target }}"/* out/ 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pideck-lite-${{ matrix.target }}
          path: out
          if-no-files-found: warn

  publish:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The feed is releases/latest/download/appcast-<target>.xml, so a
      # release that leaves one out answers 404 for that target's updates
      # until a later release carries it again.
      - name: Appcasts
        if: ${{ secrets.NSGO_UPDATES_KEY != '' }}
        shell: bash
        run: |
          missing=""
          for target in windows_x64 windows_arm64 macos_arm64 macos_x64 linux_x64 linux_arm64; do
            test -f "artifacts/appcast-$target.xml" || missing="$missing $target"
          done
          if [ -n "$missing" ]; then
            echo "::error::no appcast for:$missing (NSGO_UPDATES_KEY signs them)"
            exit 1
          fi
          ls -1 artifacts/appcast-*.xml

      - name: Checksums
        shell: bash
        run: |
          cd artifacts
          # One line per file so a download can be checked with
          # sha256sum -c SHA256SUMS
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
