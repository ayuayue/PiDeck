name: Mac Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build macOS arm64 test artifact
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate app icon
        run: npm run make-icon

      - name: Build macOS arm64 package
        run: npm run build:fast && npx electron-builder --mac dmg zip --arm64 --publish never --config scripts/electron-builder.config.js
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_NAME: ${{ secrets.MAC_CSC_NAME }}
          PIDECK_MAC_TEAM_ID: ${{ vars.MAC_TEAM_ID || secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # Developer ID 签名 + 公证；secrets 未配置时回退 ad-hoc（scripts/electronBuilderConfig.js）。
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # 打包后门禁：bundle 必须有有效签名（无 Apple 证书时靠 build.mac.identity 的显式
      # ad-hoc，原因见 docs/release-process.md「打包验证」与 issue #347；有证书时要求 Developer ID + 公证）。
      - name: Verify macOS bundle signature
        run: node scripts/verify-mac-signature.mjs
        env:
          PIDECK_MAC_REQUIRE_DEVELOPER_ID: ${{ secrets.MAC_CSC_LINK != '' || secrets.MAC_CSC_NAME != '' }}
          PIDECK_MAC_TEAM_ID: ${{ vars.MAC_TEAM_ID || secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_NAME: ${{ secrets.MAC_CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS test artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiDeck-macos-arm64-test
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
