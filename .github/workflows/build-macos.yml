name: Build macOS

# 手动触发：可选构建分支/tag（默认 main）与目标架构（默认 both = arm64 + x64）
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要构建的分支或 tag（如 dev、main、v0.7.0）
        required: false
        default: main
      arch:
        description: 目标架构
        required: false
        default: both
        type: choice
        options:
          - both
          - x64
          - arm64

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch == 'both' && '["arm64", "x64"]' || format('["{0}"]', inputs.arch)) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      # Go 工具链钉版本：runner 预装 Go 版本浮动，低于 go.mod 要求（1.26，modernc.org/sqlite v1.60.1 也要求 1.26）时
      # build:xue-index 会 fail-open 静默跳过（包里没 sidecar，运行时降级 sql.js）——
      # 不红灯但功能缺失，所以必须显式安装而不是赌镜像预装版本
      - name: Setup Go (sidecar builds)
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: |
            native/xue-index/go.sum
            native/file-index/go.sum

      # 三个 sidecar 的 Go 单测：宿主与 Go 侧的协议字段名/索引语义是手写镜像，
      # 本地漏跑时靠这里兜底（例如快照与语料同代校验、URI 路径转义）
      - name: Go unit tests (sidecars)
        run: |
          go -C native/session-index test ./...
          go -C native/xue-index test ./...
          go -C native/file-index test ./...
          go -C native/session-store test ./...

      - name: Install dependencies
        run: npm ci

      - name: Generate app icon
        run: npm run make-icon

      - name: Build macOS ${{ matrix.arch }} package
        run: npm run build && npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          XUE_INDEX_OS: darwin
          XUE_INDEX_ARCH: ${{ matrix.arch }}
          SESSION_INDEX_OS: darwin
          SESSION_INDEX_ARCH: ${{ matrix.arch }}
          FILE_INDEX_OS: darwin
          FILE_INDEX_ARCH: ${{ matrix.arch }}
          SESSION_STORE_OS: darwin
          SESSION_STORE_ARCH: ${{ matrix.arch }}

      # 打包后门禁：bundle 必须有有效签名（无 Apple 证书时靠 build.mac.identity 的显式
      # ad-hoc，原因见 docs/release-process.md「打包验证」与 issue #347）。
      - name: Verify macOS bundle signature
        run: node scripts/verify-mac-signature.mjs

      - name: Upload macOS ${{ matrix.arch }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiDeck-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
