name: Publish DSH runtime

# DSH runtime tgz：官方 lite 安装包不随 runtime，用户首次用 DSH 时按需下载。
# 该文件需要提交到默认分支；否则 GitHub Actions 不会在页面注册/显示本 workflow。
# 两种打包模式（2026-09 起二选一，cross_pack 输入控制）：
# - 交叉模式（推荐）：单 ubuntu runner 交叉打包全 6 平台，无需原生 runner
#   （lock 驱动 + prebuild 分发，详见 docs/dsh-runtime-cross-pack.md）；
# - 原生模式（回退）：按平台原生 runner 逐平台打包（与 2026-09 前行为一致）。
# 产物挂到目标 GitHub *应用* Release（vX.Y.Z；留空时取 latest），再按需手动重跑
# sync-atomgit。禁止独立 dsh-runtime tag：会抢走 /releases/latest，把更新检查指到
# sidecar。追加资产只产生 release: edited，不会自动触发 sync-atomgit。
# 该 workflow 必须存在于默认分支 main；GitHub Actions 列表默认只展示默认分支上的定义。
# dev 与 main 使用同一份 workflow；dev 也只从 Release 资产下载/上传，不读项目内 runtime。
# 注意：发布 workflow 不从 dev 分支运行；需要先把此文件合入默认分支，Actions 页面才会出现。

on:
  workflow_dispatch:
    inputs:
      tag:
        # 下拉（choice）的选项只能是静态列表，无法动态读取 Release 列表；
        # 列表外的历史版本（如给旧版本补 runtime）用下面的 tag_custom 手填。
        # choice 不接受空字符串选项，故「留空 = latest」用哨兵值 auto 表示，
        # 在下方 Upload 步骤里还原成空串，直接复用原有的 latest 分支逻辑。
        description: "目标应用 Release tag：auto = 当前 GitHub latest；列表外的旧版本填下面的 tag_custom（如 v0.7.6-beta、v0.5.2）"
        required: false
        type: choice
        default: auto
        options:
          - auto
          - v0.7.8
          - v0.7.7
          - v0.7.6
          - v0.7.5
          - v0.7.4
          - v0.7.3
          - v0.7.2
          - v0.7.1
          - v0.7.0
          - v0.6.7
      tag_custom:
        description: "自定义 tag（填了则覆盖上面的下拉选择；用于列表外的旧版本）"
        required: false
        type: string
        default: ""
      cross_pack:
        # 2026-09 起 runtime 打包支持 lock 驱动交叉解析（--target-os/--target-arch），
        # 不再必须原生 runner：勾选后在单个 ubuntu runner 上打全 6 平台。
        # 默认仍走原生矩阵（行为保守，历史版本补发场景与本 workflow 原语义一致）。
        description: "在单个 ubuntu runner 上交叉打包全 6 平台（推荐；不勾则按下方原生矩阵逐平台打包）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # 交叉模式（cross_pack=true）：单 ubuntu runner 一次打全 6 平台，替代原生矩阵。
  # 闭包内所有原生依赖都是 prebuild 分发，无本机编译；详见 docs/dsh-runtime-cross-pack.md。
  pack-and-upload-cross:
    name: Cross-pack all platforms
    if: ${{ inputs.cross_pack == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: win32
            arch: x64
          - os: win32
            arch: arm64
          - os: darwin
            arch: x64
          - os: darwin
            arch: arm64
          - os: linux
            arch: x64
          - os: linux
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      # 交叉解析本身只要 npm + package-lock.json（runtime 闭包由 pack 脚本在隔离
      # 目录自装），但**不能**因此省掉完整 npm ci——pack 脚本还会做两件必须依赖 root
      # node_modules 的事：
      #   1) 裸 import tar（prod）/ semver（dev）：归档写入与范围匹配；
      #   2) 构建仓库内的 file: 本地包 packages/dsh-tool-pwsh-persistent（dsh pwsh
      #      工具）：需 tsc + @types/node，且其 src 直接 import @deepseek-ai/
      #      {dsh-tools,dsh-timeout,schemastery,dsh-pwsh-local} 类型——这些只在 dev
      #      树里，--omit=dev 装不到。
      # 2026-09-22 两次事故都源于此：v0.7.7 发布时漏 tar → 12 个 runtime 资产全缺；
      # 补发时又因 --omit=dev 缺 tsc/@deepseek-ai → 6 个平台再次全挂。
      # 所以这里老老实实装完整依赖（ubuntu 约 45 秒），--ignore-scripts 跳过 electron
      # 等原生后置脚本（本 job 不需要二进制）。不要再手工 curl 拼 node_modules。
      # 与 release.yml 的 pack-dsh-runtime 保持同一套准备步骤与方法注释；改一处记得另一处。
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # 依赖再被「优化」掉就在这里先红：覆盖上面两组历史缺包的裸 import / 构建工具链。
      - name: Verify packing script deps resolvable
        shell: bash
        run: |
          node --input-type=module -e "await import('tar'); await import('semver'); console.log('packing script deps ok')"
          node -e "require.resolve('typescript'); require.resolve('@deepseek-ai/dsh-tools'); console.log('local package build deps ok')"
          test -d node_modules/@types/node

      - name: Pack DSH runtime (cross)
        run: node scripts/pack-dsh-runtime.mjs --target-os ${{ matrix.os }} --target-arch ${{ matrix.arch }}

      - name: Check runtime archive
        run: node scripts/check-dsh-asar.mjs --target-os ${{ matrix.os }} --target-arch ${{ matrix.arch }}

      - name: Upload onto app Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          INPUT_TAG: ${{ inputs.tag_custom != '' && inputs.tag_custom || inputs.tag }}
          ARCHIVE: dsh-runtime-${{ matrix.os }}-${{ matrix.arch }}.tgz
          INDEX: dsh-runtime-${{ matrix.os }}-${{ matrix.arch }}-releases.json
        shell: bash
        run: |
          if [ ! -f "dist-runtime/${ARCHIVE}" ] || [ ! -f "dist-runtime/${INDEX}" ]; then
            echo "::error::缺少产物 dist-runtime/${ARCHIVE} 或 ${INDEX}"
            ls -la dist-runtime || true
            exit 1
          fi
          if [ "$INPUT_TAG" = "auto" ]; then INPUT_TAG=""; fi
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
          fi
          TAG="$(echo "$TAG" | xargs)"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "::error::目标不是应用版本 tag（got ${TAG}）。拒绝创建独立 sidecar Release。"
            exit 1
          fi
          echo "Uploading ${ARCHIVE} onto ${TAG}"
          for i in 1 2 3 4 5; do
            if gh release upload "$TAG" "dist-runtime/${ARCHIVE}" "dist-runtime/${INDEX}" --clobber --repo "${{ github.repository }}"; then
              exit 0
            fi
            echo "upload failed, retry ${i}/5"
            sleep $((i * 5))
          done
          echo "::error::上传 ${ARCHIVE} 到 ${TAG} 失败"
          exit 1

  # 原生模式（默认）：与 2026-09 前行为一致，逐平台原生 runner 打包。
  # 仅 cross_pack 非 true 时运行，作为交叉模式的回退路径（交叉链路出问题时的手动入口）。
  pack-and-upload:
    name: Pack ${{ matrix.name }}
    if: ${{ inputs.cross_pack != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # pack-dsh-runtime.mjs 用 process.platform/arch 命名产物，必须原生 runner。
          - name: Windows x64
            os: windows-latest
            platform: win32
            arch: x64
          - name: Windows arm64
            os: windows-11-arm
            platform: win32
            arch: arm64
          - name: macOS x64
            os: macos-15-intel
            platform: darwin
            arch: x64
          - name: macOS arm64
            os: macos-latest
            platform: darwin
            arch: arm64
          - name: Linux x64
            os: ubuntu-latest
            platform: linux
            arch: x64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Assert runner matches matrix
        shell: bash
        run: |
          got="$(node -p "process.platform + '-' + process.arch")"
          expect="${{ matrix.platform }}-${{ matrix.arch }}"
          if [ "$got" != "$expect" ]; then
            echo "::error::runner 是 ${got}，矩阵期望 ${expect}。原生模块不能交叉打包。"
            exit 1
          fi

      # windows-11-arm runner 上 npm ci 解包 1.5k+ 包要 10+ 分钟（x64 约 1 分钟，
      # 缓存命中也一样——瓶颈是 reify 的海量小文件写，不是下载）。
      # 依赖只在 lockfile 变化时才有意义，这里直接缓存 node_modules，命中即跳过安装。
      # 无 restore-keys：部分命中时 cache-hit 仍为 false，npm ci 会先清 node_modules 再装，安全。
      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: dsh-pack-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci
        env:
          # 只要 @deepseek-ai 闭包和原生 prebuild；不必拉 Electron / Playwright 浏览器。
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Pack DSH runtime
        run: node scripts/pack-dsh-runtime.mjs

      - name: Check runtime archive
        run: node scripts/check-dsh-asar.mjs

      - name: Upload onto app Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          # 手工输入走 env，避免直接拼进 shell。
          # tag_custom 非空则优先（下拉列表外的旧版本），否则用下拉选择。
          INPUT_TAG: ${{ inputs.tag_custom != '' && inputs.tag_custom || inputs.tag }}
          # runtime 只生成轻量 sidecar，不触发完整 app Release；这是有意的独立上传入口。
        shell: bash
        run: |
          ARCHIVE="dsh-runtime-${{ matrix.platform }}-${{ matrix.arch }}.tgz"
          INDEX="dsh-runtime-${{ matrix.platform }}-${{ matrix.arch }}-releases.json"
          if [ ! -f "dist-runtime/${ARCHIVE}" ] || [ ! -f "dist-runtime/${INDEX}" ]; then
            echo "::error::缺少产物 dist-runtime/${ARCHIVE} 或 ${INDEX}"
            ls -la dist-runtime || true
            exit 1
          fi
          # 还原哨兵值：auto 等价于未指定（走 latest）
          if [ "$INPUT_TAG" = "auto" ]; then INPUT_TAG=""; fi
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)
          fi
          TAG="$(echo "$TAG" | xargs)"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "::error::目标不是应用版本 tag（got ${TAG}）。拒绝创建独立 sidecar Release。"
            exit 1
          fi
          echo "Uploading ${ARCHIVE} onto ${TAG}"
          # 六平台并发往同一 Release 追加时 GitHub API 偶发 422，短回退重试。
          for i in 1 2 3 4 5; do
            if gh release upload "$TAG" \
              "dist-runtime/${ARCHIVE}" \
              "dist-runtime/${INDEX}" \
              --clobber \
              --repo "${{ github.repository }}"; then
              exit 0
            fi
            echo "upload failed, retry ${i}/5"
            sleep $((i * 5))
          done
          echo "::error::上传 ${ARCHIVE} 到 ${TAG} 失败"
          exit 1
