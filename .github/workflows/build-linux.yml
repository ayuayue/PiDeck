name: Build Linux

# 手动触发：可选构建分支/tag（默认 main）与目标架构（默认 both = x64 + arm64）
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要构建的分支或 tag（如 dev、main、v0.7.0）
        required: false
        default: main
      arch:
        description: 目标架构
        required: false
        default: both
        type: choice
        options:
          - both
          - x64
          - arm64

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # arch 与 runner 必须配对（arm64 走原生 ARM runner），
        # 所以按 inputs.arch 直接选出目标条目，避免 matrix 里拼 JSON 字符串。
        include: ${{ inputs.arch == 'x64'   && fromJSON('[{"arch":"x64","os":"ubuntu-latest"}]')
                 || inputs.arch == 'arm64' && fromJSON('[{"arch":"arm64","os":"ubuntu-24.04-arm"}]')
                 ||                           fromJSON('[{"arch":"x64","os":"ubuntu-latest"},{"arch":"arm64","os":"ubuntu-24.04-arm"}]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate app icon
        run: npm run make-icon

      - name: Build Linux ${{ matrix.arch }} package
        run: npm run build && npx electron-builder --linux AppImage deb tar.gz --${{ matrix.arch }} --publish never
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload Linux ${{ matrix.arch }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-desktop-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.blockmap
            release/latest-linux.yml
